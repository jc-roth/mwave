[project]
name = "mwave"
version = "3.0.0"
description = "A package for simulating atom interferometers."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "jc-roth", email = "2797077+jc-roth@users.noreply.github.com" },
]
dependencies = [
    "numba>=0.60.0",
    "numpy>=2.0.0",
    "graphviz>=0.20.3",
    "matplotlib>=3.9.2",
    "scipy>=1.13.1",
    "sympy>=1.13.2",
    "tqdm>=4.66.5",
    "jinja2==3.1.0",
    "h5py>=3.13.0",
]

[project.optional-dependencies]
dev = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "nbsphinx>=0.9.6",
    "pytest>=8.3.4",
]

[tool.uv]
package = true

[tool.uv.sources]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mwave"]
exclude = ["src/mwave/integrate/xintegrate.py"]

[tool.hatch.build.targets.sdist]
exclude = ["src/mwave/integrate/xintegrate.py"]
